plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "com.peterabeles.gversion" version "1.10"
    id("com.diffplug.spotless") version "7.0.0.BETA4"
    id "net.ltgt.errorprone" version "5.1.0"
    id "info.solidsoft.pitest" version "1.19.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamOrDefault(6377)
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    // https://www.chiefdelphi.com/t/2024-wpilib-feedback/464322/141
                    final MAX_JAVA_HEAP_SIZE_MB = 100
                    jvmArgs.add("-XX:+UnlockExperimentalVMOptions")

                    // Set the minimum heap size to the maximum heap size to avoid resizing
                    jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-Xms" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-XX:GCTimeRatio=5")
                    jvmArgs.add("-XX:+UseSerialGC")
                    jvmArgs.add("-XX:MaxGCPauseMillis=50")

                    // ── On-robot profiling via Java Flight Recorder ──────────────────
                    // Deploy with:  ./gradlew deploy -PenableProfiling
                    // After running, copy the file off the robot with:
                    //   scp admin@10.63.77.2:/home/lvuser/profile.jfr .
                    // Then open profile.jfr in IntelliJ (Run -> Open Profiler Snapshot)
                    // or in JDK Mission Control (jmc).
                    // WARNING: do not use during a match. Revert with a plain deploy after.
                    if (project.hasProperty('enableProfiling')) {
                        jvmArgs.add("-XX:+FlightRecorder")
                        jvmArgs.add("-XX:StartFlightRecording=duration=60s,filename=/home/lvuser/profile.jfr,settings=profile,name=RobotProfile")
                        println "WARNING: Profiling mode ON - JFR will save to /home/lvuser/profile.jfr after 60s"
                    }
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Configuration for AdvantageKit
repositories {
    mavenLocal()
}

task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'net.jqwik:jqwik:1.9.3'
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

// Error Prone static analysis (Layer 1: Linting)
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // Treat all default checks as errors (high-confidence checks only)
        allErrorsAsWarnings = false
    }
}


// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/New_York"
    indent       = "  "
}

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Sync camera positions from VisionConstants.java to AdvantageScope config.json
task syncAdvantageScopeConfig {
    def visionConstantsFile = file('src/main/java/frc/robot/subsystems/vision/VisionConstants.java')
    def configFile = file('AdvantageScopeAssets/Robot_HowdyBot_2026/config.json')

    inputs.file visionConstantsFile
    outputs.file configFile

    doLast {
        def src = visionConstantsFile.text

        def extract = { String name ->
            def m = (src =~ /(?m)$name\s*=\s*([^;]+);/)
            if (m.find()) return m.group(1).trim() as double
            throw new GradleException("Could not find $name in VisionConstants.java")
        }

        def x = extract('CAMERA0_X_INCHES')
        def y = extract('CAMERA0_Y_INCHES')
        def z = extract('CAMERA0_Z_INCHES')
        def pitch = extract('CAMERA0_PITCH_DEG')
        def yaw = extract('CAMERA0_YAW_DEG')

        def config = new groovy.json.JsonSlurper().parse(configFile)
        def cam = config.cameras.find { it.name == 'Shooter-Cam' }
        if (cam == null) throw new GradleException("Camera 'Shooter-Cam' not found in config.json")

        cam.position = [x, y, z]
        cam.rotations = [
            [axis: 'y', degrees: -pitch],
            [axis: 'z', degrees: -yaw]
        ]

        configFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        println "Synced camera0 position to AdvantageScope config.json"
    }
}
project.compileJava.dependsOn(syncAdvantageScopeConfig)

// Fetch the JFR profile from the roboRIO after a profiling run.
// Usage: ./gradlew fetchProfile
// Requires: robot connected, profile.jfr already written (i.e. 60s have elapsed after deploy)
task fetchProfile(type: Exec) {
    group = "Profiling"
    description = "Copies /home/lvuser/profile.jfr from the roboRIO to the project root."
    commandLine "scp", "-o", "StrictHostKeyChecking=no",
            "admin@10.63.77.2:/home/lvuser/profile.jfr",
            "${projectDir}/profile.jfr"
    doLast {
        println "Saved to: ${projectDir}/profile.jfr"
        println "Open in IntelliJ: Run -> Open Profiler Snapshot"
        println "Or open in JDK Mission Control (jmc)"
    }
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**'
        }
        toggleOffOn()
        palantirJavaFormat('2.39.0').formatJavadoc(true)
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include ""
            exclude "**/build/**", "**/build-*/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**"
        }
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
}

// PITest mutation testing (Layer 4)
// Scoped to pure-Java classes only (no WPILib native deps) to avoid
// classpath issues in PITest's forked JVM. TrajectoryBall tests still
// run in the regular 'test' task but are excluded from mutation analysis.
pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'frc.robot.util.OILayer.ControlCurve'
    ]
    targetTests = ['frc.robot.util.OILayer.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // Use all default mutators EXCEPT CONDITIONALS_BOUNDARY — all boundary
    // mutations in ControlCurve are equivalent mutants (the curve formula is
    // C0-continuous at the deadzone boundary, so < vs <= produces identical output).
    mutators = [
        'INVERT_NEGS',
        'MATH',
        'NEGATE_CONDITIONALS',
        'INCREMENTS',
        'VOID_METHOD_CALLS',
        'EMPTY_RETURNS',
        'FALSE_RETURNS',
        'TRUE_RETURNS',
        'NULL_RETURNS',
        'PRIMITIVE_RETURNS'
    ]
}

// Generate a human-readable audit summary after PITest runs
task auditSummary {
    group = "Verification"
    description = "Generates a human-readable HTML summary of all audit results"
    mustRunAfter 'pitest', 'test'
    doLast {
        def xmlFile = file("build/reports/pitest/mutations.xml")
        def testReport = file("build/reports/tests/test/index.html")
        def summaryFile = file("build/reports/audit-summary.html")

        // Parse PITest XML
        def killed = []
        def survived = []
        if (xmlFile.exists()) {
            def mutations = new XmlSlurper().parse(xmlFile)
            mutations.mutation.each { m ->
                def info = [
                    status: m.@status.toString(),
                    sourceFile: m.sourceFile.text(),
                    mutatedClass: m.mutatedClass.text(),
                    mutatedMethod: m.mutatedMethod.text(),
                    lineNumber: m.lineNumber.text(),
                    mutator: m.mutator.text().replaceAll(/.*\./, ''),
                    description: m.description.text(),
                    killingTest: m.killingTest.text()
                ]
                if (info.status == 'KILLED') killed << info
                else survived << info
            }
        }

        def total = killed.size() + survived.size()
        def pct = total > 0 ? Math.round(killed.size() * 100.0 / total) : 0

        // Read source files for context
        def sourceCache = [:]
        def getSourceLine = { String clazz, String lineNum ->
            def path = "src/main/java/" + clazz.replace('.', '/') + ".java"
            if (!sourceCache.containsKey(path)) {
                def f = file(path)
                sourceCache[path] = f.exists() ? f.readLines() : []
            }
            def lines = sourceCache[path]
            def ln = lineNum.toInteger()
            return (ln > 0 && ln <= lines.size()) ? lines[ln - 1].trim() : '(source not found)'
        }

        // Build HTML
        def html = new StringBuilder()
        html << """<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Audit Summary — FRC 6377</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 12px; }
  h2 { color: #c9d1d9; margin-top: 32px; }
  .stats { display: flex; gap: 24px; margin: 20px 0; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 24px; text-align: center; }
  .stat .number { font-size: 36px; font-weight: bold; }
  .stat .label { font-size: 13px; color: #8b949e; margin-top: 4px; }
  .green { color: #3fb950; }
  .red { color: #f85149; }
  .yellow { color: #d29922; }
  .blue { color: #58a6ff; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  th { text-align: left; background: #161b22; color: #8b949e; padding: 8px 12px; font-size: 12px; text-transform: uppercase; }
  td { padding: 8px 12px; border-bottom: 1px solid #21262d; font-size: 14px; }
  tr:hover { background: #161b22; }
  code { background: #1c2128; padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #e6edf3; }
  .survived-row td { border-left: 3px solid #f85149; }
  .killed-row td { border-left: 3px solid #3fb950; }
  .help { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 20px; margin: 20px 0; }
  .help h3 { margin-top: 0; color: #58a6ff; }
  .help p { color: #8b949e; margin: 6px 0; font-size: 14px; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head><body>
<h1>Audit Summary</h1>

<div class="help">
  <h3>How to read this report</h3>
  <p><b>Mutation testing</b> takes your code, introduces small bugs (mutations), and re-runs your tests.</p>
  <p><span class="green">Killed</span> = your tests caught the bug (good!). <span class="red">Survived</span> = your tests missed it (test gap!).</p>
  <p><b>Goal:</b> kill rate as close to 100% as possible. Surviving mutants show where your tests are weak.</p>
</div>

<div class="stats">
  <div class="stat"><div class="number blue">${total}</div><div class="label">Total Mutations</div></div>
  <div class="stat"><div class="number green">${killed.size()}</div><div class="label">Killed (caught)</div></div>
  <div class="stat"><div class="number red">${survived.size()}</div><div class="label">Survived (missed)</div></div>
  <div class="stat"><div class="number ${pct >= 80 ? 'green' : pct >= 60 ? 'yellow' : 'red'}">${pct}%</div><div class="label">Kill Rate</div></div>
</div>
"""

        if (survived.size() > 0) {
            html << """
<h2><span class="red">Surviving Mutants — Test Gaps</span></h2>
<p>These mutations were NOT caught by your tests. Each one is a place where your tests could be stronger.</p>
<table>
<tr><th>#</th><th>File : Line</th><th>What was changed</th><th>Your code</th></tr>
"""
            survived.eachWithIndex { m, i ->
                def src = getSourceLine(m.mutatedClass, m.lineNumber)
                html << """<tr class="survived-row">
  <td>${i + 1}</td>
  <td><code>${m.sourceFile}:${m.lineNumber}</code></td>
  <td>${m.description}</td>
  <td><code>${src.replace('<', '&lt;').replace('>', '&gt;')}</code></td>
</tr>
"""
            }
            html << "</table>\n"
        }

        if (killed.size() > 0) {
            html << """
<h2><span class="green">Killed Mutants — Working Tests</span></h2>
<p>These mutations were caught by your tests. Your tests correctly verify this logic.</p>
<table>
<tr><th>#</th><th>File : Line</th><th>What was changed</th><th>Caught by</th></tr>
"""
            killed.eachWithIndex { m, i ->
                def testName = m.killingTest.replaceAll(/.*\[method:/, '').replaceAll(/\].*/, '').replaceAll(/.*\[property:/, '')
                html << """<tr class="killed-row">
  <td>${i + 1}</td>
  <td><code>${m.sourceFile}:${m.lineNumber}</code></td>
  <td>${m.description}</td>
  <td><code>${testName}</code></td>
</tr>
"""
            }
            html << "</table>\n"
        }

        html << """
<div class="help">
  <h3>Common mutation types</h3>
  <p><b>changed conditional boundary:</b> Changed &lt; to &lt;= (or &gt; to &gt;=). Tests should check boundary values.</p>
  <p><b>negated conditional:</b> Flipped true/false in an if-statement. Tests should check both branches.</p>
  <p><b>replaced math operator:</b> Changed + to -, * to /, etc. Tests should verify calculation results.</p>
  <p><b>replaced return value:</b> Changed what a method returns. Tests should assert return values.</p>
</div>

<p style="color:#8b949e; font-size:12px; margin-top:40px;">
  Generated by <code>./gradlew audit</code> &middot;
  <a href="tests/test/index.html">Test Report</a> &middot;
  <a href="pitest/index.html">Detailed PITest Report</a>
</p>
</body></html>"""

        summaryFile.text = html.toString()
        println "\n===== Audit Summary ====="
        println "  Mutations: ${total} total, ${killed.size()} killed, ${survived.size()} survived (${pct}% kill rate)"
        if (survived.size() > 0) {
            println "  Surviving mutants (test gaps):"
            survived.eachWithIndex { m, i ->
                def src = getSourceLine(m.mutatedClass, m.lineNumber)
                println "    ${i+1}. ${m.sourceFile}:${m.lineNumber} — ${m.description}"
                println "       Code: ${src}"
            }
        }
        println "  Report: ${summaryFile.toURI()}"
        println "========================="
        java.awt.Desktop.desktop.browse(summaryFile.toURI())
    }
}

// Umbrella task: runs all 4 bug-finding layers
task audit {
    group = "Verification"
    description = "Runs all 4 layers: Error Prone (compile), unit tests, property tests, mutation tests"
    dependsOn 'test', 'pitest'
    finalizedBy 'auditSummary'
}
